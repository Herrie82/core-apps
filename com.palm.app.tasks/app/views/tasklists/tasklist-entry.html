<div class="palm-row #{classFormatted}" x-mojo-tap-highlight="momentary">
	<div class="palm-row-wrapper">
	    <div class="tasks-due" style="-webkit-transform: rotate(#{unreadTagRotation}deg);"><span>#{dueItemCountFormatted}</span></div>
		<div class="icon right tasklist-icon" style="display:#{iconPresent}; background:url(#{iconLocation}) center center no-repeat;"></div> <!-- display:block to show this eas-icon -->
	    <div class="title truncating-text">#{-nameFormatted}</div>
	</div>
</div>
