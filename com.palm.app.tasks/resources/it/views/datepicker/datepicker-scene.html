<div id="palm-dialog-content" class="palm-dialog-content">
    <div id="title" class="dialog-title">
    </div>
    <div class="palm-dialog-separator">
    </div>
    <div id='datepicker' x-mojo-element="DatePicker">
    </div>
</div>
<div class="palm-dialog-buttons">
	<div id='select' class="palm-button" x-mojo-tap-highlight="immediate">
		Imposta scadenza
	</div>
	<div id='none' class="palm-button" x-mojo-tap-highlight="immediate">
		Nessuna scadenza
	</div>
	<div id='cancel' class="palm-button" x-mojo-tap-highlight="immediate">
		Annulla
	</div>
</div>
